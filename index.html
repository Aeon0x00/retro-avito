    .top-link:hover { color: var(--avito-blue); }

    
    .header-row {

    .brand-logo {

    .brand-dots { display: grid; grid-template-columns: 8px 8px; gap: 3px; }

    .search-box-wrap input {

    }
    .search-btn {

    .search-btn:hover { background: var(--avito-blue-hover); }

    .city-select-btn {

    .pill-label {

    }
    .pill-img {

    }
    .hero-legal-sidebar a {

    .btn-outline-dark {

    .floating-help-widget:hover { transform: scale(1.03); background: #262626; }

    
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 8px 14px; border-radius: 8px; font-weight: 600;
      font-size: 13px; cursor: pointer; border: none; transition: 0.15s ease;
      text-decoration: none;

    .btn-primary { background: var(--avito-blue); color: #fff; }
    .btn-primary:hover { background: var(--avito-blue-hover); }
    .btn-secondary { background: #f0f0f0; color: #141414; }
    .btn-secondary:hover { background: #e5e5e5; }
    .btn-dark { background: #141414; color: #fff; }
    .btn-dark:hover { background: #333; }
    .btn-outline { background: #fff; border: 1px solid var(--avito-border); color: #141414; }
    .btn-outline:hover { background: #f9f9f9; }
    .btn-danger { background: var(--avito-red); color: #fff; }

    .badge {

    .b-private { background: #f1f5f9; color: #475569; }
    .b-public { background: #e0f2fe; color: #0284c7; }
    .b-archive { background: #fef3c7; color: #b45309; }
    .b-wish { background: #fce7f3; color: #be185d; }
    .b-helpful { background: #dcfce7; color: #15803d; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500;
      display: flex; align-items: center; justify-content: center; padding: 16px;

    .modal-card {

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
    .form-input, .form-textarea, .form-select {

    }
    @media (max-width: 768px) {
      .hero-categories-layout { grid-template-columns: 1fr; }
      .hero-legal-sidebar { display: none; }
      .pills-grid { grid-template-columns: repeat(2, 1fr); }
      .goods-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .goods-grid { grid-template-columns: 1fr; }
    }

                            recognitions: val ? prev.recognitions.map(r => r.status === 'active_public' ? { ...r, status: 'active_private' } : r) : prev.recognitions
                          }));
                          notify(val ? 'Раздел признания включён (карточки возвращены как личные).' : 'Раздел признания и публичные карточки скрыты.');
                        }}
                      />
                      Показывать карточки признания «За полезную помощь» в открытой полке
                    </label>
                  </div>
                )}
                <button className="btn btn-primary" onClick={() => notify('Настройки уведомлений сохранены.')}>Сохранить настройки</button>
              </div>
            )}
            {screen === 'S15' && (
              <div className="card" style={{ maxWidth: 560, margin: '30px auto', textAlign: 'center', padding: 36 }}>
                <h2>Материал временно недоступен</h2>
                <p style={{ color: 'var(--avito-muted)' }}>Запись была скрыта автором, перенесена в архив или недоступна в текущем режиме.</p>
                <button className="btn btn-primary" onClick={() => navigateTo('S01', undefined, true)}>Вернуться в коллекцию</button>
              </div>
            )}
            {(screen === 'S16' || screen === 'S17') && currentRecognition && (
              <div className="card" style={{ maxWidth: 700, margin: '0 auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <h2 style={{ margin: 0 }}>🤝 Карточка «За полезную помощь»</h2>
                  <span className={`badge ${currentRecognition.status === 'active_public' ? 'b-helpful' : currentRecognition.status === 'inactive' ? 'b-archive' : currentRecognition.status === 'revoked' ? 'b-revoked' : 'b-private'}`}>
                    {currentRecognition.status === 'active_public' && '🌐 Опубликована получателем'}
                    {currentRecognition.status === 'active_private' && '🔒 Личная (видна только получателю)'}
                    {currentRecognition.status === 'inactive' && '⏸️ Неактивна (снято «Помогло» или ответ изменён)'}
                    {currentRecognition.status === 'revoked' && '⚠️ Отменена модерацией'}
                  </span>
                </div>
                <div style={{ padding: 18, background: '#f8fafc', border: '1px solid #cbd5e1', borderRadius: 12, marginBottom: 16 }}>
                  <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 6 }}>«Автор вопроса отметил ответ как полезный»</div>
                  <div><b>Получатель благодарности:</b> {currentRecognition.recipientName}</div>
                  <div><b>По вопросу:</b> «{currentRecognition.questionTitle}»</div>
                  <div style={{ fontSize: 12, color: 'var(--avito-muted)', marginTop: 8 }}>
                    Это символическая благодарность без баллов, скидок, ранга и звания эксперта. Помощь не требует покупки.
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {currentRecognition.status === 'active_private' && (
                    <button className="btn btn-primary" onClick={() => setModal({ code: 'M07', payload: currentRecognition })}>
                      🌐 Опубликовать карточку в открытой полке
                    </button>
                  )}
                  {currentRecognition.status === 'active_public' && (
                    <button className="btn btn-outline" onClick={() => {
                      setData(prev => ({
                        ...prev,
                        recognitions: prev.recognitions.map(r => r.rewardId === currentRecognition.rewardId ? { ...r, status: 'active_private' } : r)
                      }));
                      notify('Карточка признания скрыта от других (теперь снова личная).');
                    }}>
                      🔒 Скрыть карточку от других
                    </button>
                  )}
                  <button className="btn btn-secondary" onClick={() => navigateTo('S11', currentRecognition.questionId)}>
                    Перейти к исходному ответу
                  </button>
                </div>
              </div>
            )}
            {screen === 'A01' && currentListing && (
              <div className="card" style={{ maxWidth: 800, margin: '0 auto' }}>
                <button className="btn btn-secondary" onClick={() => goBack()} style={{ marginBottom: 12 }}>← Вернуться в Полки</button>
                <span className="badge b-archive">Объявление на Авито</span>
                <h1 style={{ margin: '8px 0' }}>{currentListing.title}</h1>
                {!currentListing.available ? (
                  <div style={{ padding: 16, background: '#fee2e2', color: '#991b1b', borderRadius: 10 }}>
                    Объявление снято с продажи. Контакт и покупка недоступны, но ваш запрос «Ищу» остаётся открытым (Q13).
                  </div>
                ) : (
                  <div>
                    <div style={{ fontSize: 26, fontWeight: 800, margin: '8px 0' }}>{currentListing.price}</div>
                    <p>{currentListing.description}</p>
                    <div style={{ display: 'flex', gap: 10, marginTop: 14 }}>
                      <button className="btn btn-primary" onClick={() => navigateTo('A04')}>Написать продавцу в чат</button>
                      <button className="btn btn-dark" onClick={() => navigateTo('A05')}>Купить с Авито Доставкой</button>
                    </div>
                  </div>
                )}
              </div>
            )}
            {(screen === 'A04' || screen === 'A05') && (
              <div className="card" style={{ maxWidth: 600, margin: '0 auto', textAlign: 'center', padding: 32 }}>
                <h2>{screen === 'A04' ? 'Чат покупателя и продавца' : 'Заказ получен и завершён'}</h2>
                <p style={{ color: 'var(--avito-muted)' }}>
                  Реальные сообщения и платежи в учебном прототипе не отправляются. Из завершённой покупки можно предзаполнить черновик модели для своей полки.
                </p>
                <div style={{ display: 'flex', justifyContent: 'center', gap: 10, marginTop: 16 }}>
                  <button className="btn btn-secondary" onClick={() => goBack()}>← Назад</button>
                  <button className="btn btn-primary" onClick={() => {
                    setItemForm({
                      id: null, title: 'Москвич-408 (А1) из покупки Авито', model: 'Москвич-408',
                      manufacturer: 'Тантал (Саратов)', series: 'А1', scale: '1:43',
                      completeness: 'С коробкой', condition: 'Отличное',
                      privateNote: 'Добавлено из учебной покупки Авито.', modelCode: 'moskvich', customPhoto: ''
                    });
                    navigateTo('S02');
                  }}>+ Добавить покупку в коллекцию</button>
                </div>
              </div>
            )}
          </main>
          {modal && modal.code === 'M01' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginTop: 0 }}>Вход в профиль Авито</h2>
                <p>Для действия «{modal.payload?.intentLabel}» выберите учебную роль (сам вход ничего автоматически не публикует):</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, margin: '14px 0' }}>
                  {ROLES.filter(r => r.id !== 'guest').map(r => (
                    <button key={r.id} className="btn btn-secondary" style={{ justifyContent: 'flex-start' }} onClick={() => {
                      setData(prev => ({ ...prev, role: r.id }));
                      setModal(null);
                      notify(`Вы вошли как: ${r.name}`);
                      if (pendingAction?.callback) pendingAction.callback();
                    }}>{r.name}</button>
                  ))}
                </div>
                <button className="btn btn-outline" onClick={() => setModal(null)}>Отмена</button>
              </div>
            </div>
          )}
          {modal && modal.code === 'M02' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginTop: 0 }}>Предпросмотр перед публикацией</h2>
                <p style={{ color: 'var(--avito-muted)' }}>
                  Другие участники увидят только карточку выбранного предмета. Ваша личная заметка и остальные непубличные модели останутся закрытыми.
                </p>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 }}>
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>Отмена (оставить личным)</button>
                  <button className="btn btn-primary" onClick={() => {
                    setData(prev => ({
                      ...prev,
                      items: prev.items.map(i => i.id === modal.payload?.id ? { ...i, visibility: 'public' } : i)
                    }));
                    setModal(null);
                    notify('Предмет опубликован и теперь виден другим на открытой полке.');
                  }}>Подтвердить и опубликовать</button>
                </div>
              </div>
            </div>
          )}
          {modal && modal.code === 'M03' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginTop: 0 }}>Несохранённые изменения</h2>
                <p>Вы изменили поля формы. Выберите действие:</p>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 }}>
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>Продолжить редактирование</button>
                  <button className="btn btn-danger" onClick={() => {
                    setFormDirty(false);
                    setModal(null);
                    goBack(true);
                  }}>Уйти без сохранения</button>
                </div>
              </div>
            </div>
          )}
          {modal && modal.code === 'M04' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginTop: 0 }}>Закрыть запрос на поиск</h2>
                <p style={{ color: 'var(--avito-muted)' }}>Отметка «Найдено» — это самоотчёт о закрытии поиска, она сама по себе не создаёт покупку на Авито.</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, margin: '14px 0' }}>
                  <button className="btn btn-primary" onClick={() => {
                    setData(prev => ({ ...prev, wishes: prev.wishes.map(w => w.id === modal.payload.id ? { ...w, status: 'closed_found' } : w) }));
                    setModal(null);
                    notify('Поиск закрыт с причиной «Найдено».');
                  }}>✓ Найдено (закрыть поиск)</button>
                  <button className="btn btn-secondary" onClick={() => {
                    setData(prev => ({ ...prev, wishes: prev.wishes.map(w => w.id === modal.payload.id ? { ...w, status: 'closed_no_longer' } : w) }));
                    setModal(null);
                    notify('Поиск закрыт с причиной «Больше не ищу».');
                  }}>⏹️ Больше не ищу</button>
                </div>
                <button className="btn btn-outline" onClick={() => setModal(null)}>Отмена</button>
              </div>
            </div>
          )}
          {modal && modal.code === 'M06' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginTop: 0 }}>Скрыть предмет от других пользователей</h2>
                <p>Предмет снова станет личным («Только вы») и исчезнет с открытой полки.</p>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>Отмена</button>
                  <button className="btn btn-danger" onClick={() => {
                    setData(prev => ({ ...prev, items: prev.items.map(i => i.id === modal.payload.id ? { ...i, visibility: 'private' } : i) }));
                    setModal(null);
                    notify('Предмет скрыт от других (теперь виден только вам).');
                  }}>Подтвердить скрытие</button>
                </div>
              </div>
            </div>
          )}
          {modal && modal.code === 'M07' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginTop: 0 }}>Публикация карточки «За полезную помощь»</h2>
                <p style={{ color: 'var(--avito-muted)' }}>
                  Карточка сначала видна только вам. При согласии она появится на вашей открытой полке без раскрытия вашей личной коллекции и заметок.
                </p>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 }}>
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>Оставить личной</button>
                  <button className="btn btn-primary" onClick={() => {
                    setData(prev => ({
                      ...prev,
                      recognitions: prev.recognitions.map(r => r.rewardId === modal.payload?.rewardId ? { ...r, status: 'active_public', consentVersion: 'v1' } : r)
                    }));
                    setModal(null);
                    notify('Карточка «За полезную помощь» опубликована.');
                  }}>Показать карточку другим</button>
                </div>
              </div>
            </div>
          )}
          {modal && modal.code === 'LOG' && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal-window" style={{ maxWidth: 780 }} onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
                  <h3 style={{ margin: 0 }}>Служебный журнал событий (mode=prototype)</h3>
                  <button className="btn btn-secondary" onClick={() => setModal(null)}>Закрыть</button>
                </div>
                <div style={{ maxHeight: 340, overflowY: 'auto', background: '#0f172a', color: '#e2e8f0', padding: 12, borderRadius: 8, fontFamily: 'monospace', fontSize: 12 }}>
                  {data.eventLog.map(e => (
                    <div key={e.event_id} style={{ borderBottom: '1px solid #1e293b', padding: '4px 0' }}>
                      [{e.time}] <b>{e.event}</b> | role:{e.actor_id} | obj:{e.object_type}:{e.object_id} | arm:{e.experiment_arm}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
          <div className="floating-help-widget" onClick={() => navigateTo('S09')}>
            <span>💬</span> Клуб знатоков и «Ищу»
            <span style={{ background: '#ff4053', color: '#fff', borderRadius: '50%', padding: '1px 6px', fontSize: 11, fontWeight: 800 }}>3</span>
          </div>
          {toast && <div className="toast-box">{toast}</div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
